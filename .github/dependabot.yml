version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The SDK v3 `module.exports = class extends Homey.X` pattern needs
      # @types/node ^16 and TypeScript ^5 (TS 6+ defaults moduleDetection to
      # "force", breaking the CommonJS `module` global). See task/lessons.md.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-config-athom@4 peers on eslint >=8.57.1 <9, so ESLint 9+ can't
      # be used yet. 8.x stays allowed: it's the target of #27.
      - dependency-name: eslint
        versions: [">=9.0.0"]
      # undici 8 requires Node >=22.19; Homey runs Node 22 but doesn't document
      # the minor. 7.x (Node >=20.18.1) is fine since #36 decoupled the
      # transport from Node's bundled undici. Lift once Homey's Node is known.
      - dependency-name: undici
        versions: [">=8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
