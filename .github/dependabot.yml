version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The SDK v3 `module.exports = class extends Homey.X` pattern needs
      # @types/node ^16 and TypeScript ^5 (TS 6+ defaults moduleDetection to
      # "force", breaking the CommonJS `module` global). See task/lessons.md.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
